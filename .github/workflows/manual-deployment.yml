# This is a basic workflow to help you get started with Actions

name: Manual Deployment

# Controls when the action will run.
on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'version eg: 2.3.1'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          node-version: '15.x'
      - run: |
          yarn install
          yarn build

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Deploy Development
        run: rsync -a -P --exclude=node_modules --exclude=src --exclude=test --exclude=.git ./ bitnami@18.141.255.223:/opt/bitnami/projects/btk

      - name: Build and Run Development
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_ADDRESS }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.EC2KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" # This loads nvm
            ls
            cd /opt/bitnami/projects/btk
            nvm use 14.10
            export NODE_ENV=production
            export DATABASE_USER=${{ secrets.DATABASE_USER }}
            export DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            export DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            export AWS_REGION=${{ secrets.AWS_REGION }}
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_PUBLIC_BUCKET_NAME=${{ secrets.AWS_PUBLIC_BUCKET_NAME }}
            export SESHOST=${{ secrets.SESHOST }}
            export SESUSER=${{ secrets.SESUSER }}
            export SESPASSWORD=${{ secrets.SESPASSWORD }}
            export FROM="${{ secrets.FROM }}"
            export GOOGLE_ACCOUNT_CREDENTIALS=${{ secrets.GOOGLE_ACCOUNT_CREDENTIALS }}
            yarn --prod
            pm2 delete "btk"
            pm2 start dist/main.js --name "btk"
