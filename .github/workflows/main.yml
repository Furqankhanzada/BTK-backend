# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      - name: Setup yarn
        uses: borales/actions-yarn@v2.0.0
        with:
          cmd: install --frozen-lockfile # will run `yarn install` command
      - uses: borales/actions-yarn@v2.0.0
        with:
          cmd: build # will run `yarn build` command

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: files
        run: ls

      - name: rsync over ssh
        run: rsync -a -P --exclude=node_modules --exclude=src --exclude=test --exclude=.git ./ ubuntu@ec2-52-20-14-42.compute-1.amazonaws.com:~/repos/btk

        # Runs a single command using the runners shell
      - name: executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@master
        env:
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          NODE_ENV: "production"
        with:
          host: ${{ secrets.HOST_ADDRESS }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.EC2KEY }}
          envs: NODE_ENV,DATABASE_USER,DATABASE_PASSWORD,DATABASE_NAME
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" # This loads nvm
            echo 'enter to the server'
            ls
            echo 'enter ~/repos/btk and list file: '
            cd ~/repos/btk
            ls
            echo 'user node lastest version'
            nvm use 14.10
            echo "Node Version :"
            node -v
            npm install --only=prod
            pm2 delete "btk"
            pm2 start dist/main.js --name "btk"
